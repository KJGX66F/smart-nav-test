<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- SEO 优化 -->
    <meta name="description" content="科技共享-智能多功能响应式导航。提供高效的搜索、云端自定义网址管理、动态天气与专属壁纸等个性化功能。">
    <meta name="keywords" content="网址导航, 科技共享, 开发者导航, 智能导航, 响应式网站, 云端同步">
    
    <title id="page-title">科技共享-智能多功能响应式导航</title>
    
    <!-- 性能优化：DNS 预解析与预连接 -->
    <link rel="preconnect" href="https://cdn.tailwindcss.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    
    <!-- Google AdSense 基础脚本 -->
    <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-XXXXXXXXXXXXXXXX" crossorigin="anonymous"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* 日间模式 (Light) 基础样式 */
        body.theme-light {
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
            color: #0f172a;
        }
        body.theme-light .glass-card {
            background: rgba(255, 255, 255, 0.7);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 0, 0, 0.06);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }
        body.theme-light .glass-input {
            background: rgba(0, 0, 0, 0.04);
            color: #000;
        }
        body.theme-light input::placeholder { color: #94a3b8; }
        body.theme-light #engine-menu { background: #ffffff; border-color: #e2e8f0; }
        body.theme-light #engine-menu button { color: #334155; }
        body.theme-light #engine-menu button:hover { background: rgba(79, 70, 229, 0.08); }

        /* 夜间模式 (Dark) 基础样式 */
        body.theme-dark {
            background: linear-gradient(135deg, #0f172a 0%, #020617 100%);
            color: #f8fafc;
        }
        body.theme-dark .glass-card {
            background: rgba(30, 41, 59, 0.45);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.05);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3);
        }
        body.theme-dark .glass-input {
            background: rgba(255, 255, 255, 0.07);
        }

        /* 自定义壁纸激活状态的遮罩 */
        body.has-custom-bg::before {
            content: '';
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.55);
            backdrop-filter: blur(2px);
            z-index: -1;
        }

        /* 全局过渡动画与拖拽交互支持 */
        body, .glass-card, .glass-input, #custom-links-container {
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        
        .dragging {
            opacity: 0.4;
            transform: scale(0.98);
            border: 2px dashed #6366f1 !important;
        }

        /* 管理员权限控制类：默认非管理员隐藏编辑元素 */
        body:not(.is-admin) .admin-only {
            display: none !important;
        }

        /* 增强管理功能 */
        .modal-scroll { max-height: min(82vh, 760px); overflow-y: auto; }
        .modal-scroll::-webkit-scrollbar { width: 6px; }
        .modal-scroll::-webkit-scrollbar-thumb { background: rgba(100, 116, 139, .55); border-radius: 999px; }
        .drop-target { outline: 2px dashed rgba(99, 102, 241, .75); outline-offset: 3px; }
        .section-drag-handle, .link-drag-handle { touch-action: none; }
        .toast-enter { animation: toastIn .22s ease-out; }
        @keyframes toastIn { from { opacity: 0; transform: translateY(8px) scale(.98); } to { opacity: 1; transform: translateY(0) scale(1); } }
        @media (prefers-reduced-motion: reduce) { *, *::before, *::after { scroll-behavior: auto !important; transition-duration: .01ms !important; animation-duration: .01ms !important; animation-iteration-count: 1 !important; } }
    </style>
</head>
<body class="theme-dark font-sans antialiased selection:bg-indigo-500 selection:text-white">

    <!-- 个性化设置浮窗 -->
    <div class="fixed top-5 right-5 z-[150] relative">
        <button aria-label="个性化设置" onclick="toggleThemeMenu(event)" class="w-10 h-10 rounded-xl glass-card flex items-center justify-center text-slate-400 hover:text-indigo-500 hover:scale-105 active:scale-95 transition-all shadow-lg cursor-pointer" title="个性化设置">
            <i id="theme-icon" class="fas fa-palette text-sm"></i>
        </button>
        <div id="theme-panel" class="absolute right-0 top-full mt-2 w-60 bg-slate-900/95 border border-slate-700/80 rounded-2xl shadow-2xl hidden backdrop-blur-md p-4 space-y-3 z-[160]" onclick="event.stopPropagation()">
            <div class="text-[11px] font-bold text-slate-400 px-1 mb-1.5" data-i18n="langTitle">语言 / Language</div>
            <div class="flex gap-2 mb-3 border-b border-slate-800 pb-3">
                <button onclick="setLanguage('zh')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer">中文</button>
                <button onclick="setLanguage('en')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer">English</button>
            </div>

            <div class="text-[11px] font-bold text-slate-400 px-1" data-i18n="themeTitle">基础色彩模式 (本地偏好)</div>
            <div class="flex gap-2">
                <button onclick="setBaseTheme('theme-light')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer flex items-center justify-center gap-1"><i class="fas fa-sun text-amber-500"></i> <span data-i18n="themeLight">日间</span></button>
                <button onclick="setBaseTheme('theme-dark')" class="flex-1 py-1.5 rounded-lg bg-slate-800 text-slate-200 text-xs text-center hover:bg-slate-700 transition-colors cursor-pointer flex items-center justify-center gap-1"><i class="fas fa-moon text-indigo-400"></i> <span data-i18n="themeDark">夜间</span></button>
            </div>
            
            <div class="admin-only space-y-1.5 px-1 border-t border-slate-800 pt-3 mt-1">
                <div class="flex justify-between items-center">
                    <label class="text-[11px] text-slate-400 font-bold" data-i18n="bgTitle">自定义背景 (全站同步)</label>
                    <button onclick="clearCustomBg()" id="clear-bg-btn" class="text-[10px] text-red-400 hover:underline hidden" data-i18n="clearBg">清除壁纸</button>
                </div>
                <div class="flex gap-1.5">
                    <input type="text" id="custom-bg-input" data-i18n-placeholder="bgInputPlace" placeholder="输入图片网址 https://..." class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-100 focus:outline-none focus:border-indigo-500">
                    <button onclick="applyCustomBg()" class="bg-indigo-600 text-white px-2 py-1 rounded-lg text-xs hover:bg-indigo-500 cursor-pointer shrink-0" data-i18n="applyBtn">应用</button>
                </div>
            </div>
            
            <!-- 【新增】修改管理员密码区域 (仅管理员可见) -->
            <div class="admin-only space-y-1.5 px-1 border-t border-slate-800 pt-3 mt-1">
                <label class="text-[11px] text-slate-400 font-bold" data-i18n="pwdTitle">修改管理员密码 (全站同步)</label>
                <div class="flex gap-1.5">
                    <input type="password" id="custom-pwd-input" data-i18n-placeholder="pwdInputPlace" placeholder="输入新密码" class="w-full bg-slate-800 border border-slate-700 rounded-lg px-2 py-1 text-xs text-slate-100 focus:outline-none focus:border-emerald-500">
                    <button onclick="updateAdminPwd()" class="bg-emerald-600 text-white px-2 py-1 rounded-lg text-xs hover:bg-emerald-500 cursor-pointer shrink-0" data-i18n="saveBtn">保存</button>
                </div>
            </div>

            <div class="admin-only border-t border-slate-800 pt-3 mt-2 space-y-2">
                <div class="text-[11px] text-slate-400 font-bold px-1" data-i18n="dataManageTitle">网站数据管理</div>
                <button onclick="openDataModal()" class="w-full py-2 rounded-lg bg-indigo-600/15 border border-indigo-500/25 text-indigo-300 text-[11px] text-center hover:bg-indigo-600/30 transition-colors cursor-pointer flex items-center justify-center gap-2">
                    <i class="fas fa-file-import"></i><span data-i18n="importExportBtn">批量导入 / 导出网站</span>
                </button>
            </div>

            <div class="admin-only border-t border-slate-800 pt-2 mt-2">
                <button onclick="logoutAdmin()" class="w-full py-1.5 rounded-lg bg-red-950/40 border border-red-900/40 text-red-400 text-[11px] text-center hover:bg-red-900/40 transition-colors cursor-pointer" data-i18n="logoutBtn">退出后台管理</button>
            </div>
        </div>
    </div>

    <div class="max-w-7xl mx-auto px-4 py-12 lg:py-20 flex flex-col items-center">
        
        <!-- 时间与问候语组件 -->
        <div class="text-center mb-10 animate-fade-in">
            <h1 id="clock" class="text-5xl lg:text-7xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-indigo-400 via-purple-400 to-pink-400 mb-2">00:00:00</h1>
            <div class="flex items-center justify-center space-x-3 text-sm md:text-base font-medium tracking-wide opacity-90">
                <span id="greeting" class="text-indigo-400">正在筹备问候语...</span>
                <span class="opacity-30">|</span>
                <span id="weather-info" class="flex items-center gap-1.5 text-emerald-400">
                    <i class="fas fa-spinner fa-spin text-xs"></i> <span data-i18n="weatherLoading">正在定位测算天气...</span>
                </span>
            </div>
        </div>

        <!-- 搜索引擎组件 -->
        <div class="w-full max-w-2xl mb-16 relative z-[100]">
            <form id="search-form" action="https://www.google.com/search" method="get" target="_blank" rel="noopener noreferrer" class="relative">
                <div class="flex items-center glass-input rounded-2xl border border-slate-700/40 shadow-2xl focus-within:border-indigo-500/80 transition-all duration-300">
                    <div class="relative pl-4">
                        <button type="button" aria-label="切换搜索引擎" id="engine-btn" onclick="toggleEngineMenu(event)" class="flex items-center space-x-2 text-slate-400 hover:text-indigo-400 transition-colors py-4 pr-2 cursor-pointer">
                            <i id="engine-icon" class="fab fa-google text-blue-400"></i>
                            <i class="fas fa-chevron-down text-xs opacity-50"></i>
                        </button>
                        <div id="engine-menu" class="absolute left-2 top-full mt-2 w-36 bg-slate-950/95 border border-slate-800 rounded-xl shadow-2xl hidden backdrop-blur-md overflow-hidden z-[110]">
                            <button type="button" onclick="selectEngine('google')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fab fa-google text-blue-400"></i> <span data-i18n="enGoogle">谷歌 Google</span></button>
                            <button type="button" onclick="selectEngine('bing')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fab fa-microsoft text-teal-400"></i> <span data-i18n="enBing">必应 Bing</span></button>
                            <button type="button" onclick="selectEngine('baidu')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fas fa-paw text-red-400"></i> <span data-i18n="enBaidu">百度 Baidu</span></button>
                            <button type="button" onclick="selectEngine('github')" class="w-full text-left px-4 py-2.5 hover:bg-indigo-600/20 text-sm flex items-center space-x-2 cursor-pointer"><i class="fab fa-github text-slate-400"></i> <span>GitHub</span></button>
                        </div>
                    </div>
                    <input type="text" id="search-input" name="q" data-i18n-placeholder="searchGoogle" placeholder="在 Google 中搜索..." autocomplete="off" class="w-full bg-transparent border-none py-4 px-3 focus:outline-none focus:ring-0 text-base">
                    <button type="submit" aria-label="搜索" class="mr-3 p-2.5 text-slate-400 hover:text-indigo-400 transition-colors">
                        <i class="fas fa-search text-lg"></i>
                    </button>
                </div>
            </form>
        </div>

        <!-- 统一动态导航区域：原有区域首次运行会自动迁移，视觉布局保持不变 -->
        <div id="main-nav-grid" class="w-full grid grid-cols-1 xl:grid-cols-3 gap-8 mb-12 relative z-10 items-start"></div>

        <footer id="admin-trigger" ondblclick="triggerAdminLogin()" class="text-slate-500 text-xs mt-4 cursor-pointer select-none tracking-wide hover:text-indigo-400/70 transition-colors" title="后台入口：双击 / Double Click">
            <span data-i18n="footerText">&copy; 2026 科技共享-智能生态导航 · Powered by Cloudflare</span>
            <span id="admin-badge" class="ml-1 text-[10px] px-1.5 py-0.5 rounded bg-indigo-500/20 text-indigo-400 font-bold hidden" data-i18n="adminBadge">已登入</span>
            <span id="sync-badge" class="admin-only ml-1 text-[10px] text-slate-500"></span>
        </footer>
    </div>

    <!-- 添加 / 编辑网站 -->
    <div id="link-modal" class="fixed inset-0 bg-slate-950/65 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[300]" onclick="closeModalOnBlank(event, 'link-modal')">
        <div class="bg-slate-900 border border-slate-700/80 p-6 rounded-2xl w-full max-w-md shadow-2xl text-slate-100" onclick="event.stopPropagation()">
            <h4 class="text-md font-semibold text-slate-200 mb-4 flex items-center"><i class="fas fa-link mr-2 text-indigo-400"></i><span id="link-modal-title">添加网站</span></h4>
            <div class="space-y-4 mb-6">
                <div>
                    <label class="text-xs text-slate-400 block mb-1.5 font-medium" data-i18n="siteName">网站名称</label>
                    <input type="text" id="site-name" maxlength="60" placeholder="例如：百度" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition-all">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1.5 font-medium" data-i18n="siteNameEn">英文名称（可选）</label>
                    <input type="text" id="site-name-en" maxlength="60" placeholder="e.g. Baidu" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition-all">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1.5 font-medium" data-i18n="siteUrl">网站网址 (URL)</label>
                    <input type="url" id="site-url" placeholder="https://www.example.com" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition-all">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1.5 font-medium" data-i18n="siteIcon">图标类名（可选）</label>
                    <input type="text" id="site-icon" maxlength="80" placeholder="例如：fab fa-github" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-indigo-500 transition-all">
                    <p class="text-[10px] text-slate-500 mt-1" data-i18n="siteIconHint">留空将自动获取网站图标。</p>
                </div>
            </div>
            <div class="flex justify-end space-x-3">
                <button type="button" onclick="toggleModal('link-modal', false)" class="px-4 py-2 bg-slate-800 text-slate-400 text-xs font-medium rounded-xl hover:bg-slate-700 transition-colors cursor-pointer" data-i18n="btnCancel">取消</button>
                <button type="button" onclick="saveActiveLink()" class="px-4 py-2 bg-indigo-600 text-white text-xs font-medium rounded-xl hover:bg-indigo-500 transition-colors cursor-pointer shadow-lg shadow-indigo-600/20" data-i18n="btnSave">保存站点</button>
            </div>
        </div>
    </div>

    <!-- 添加 / 编辑区域 -->
    <div id="section-modal" class="fixed inset-0 bg-slate-950/65 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[310]" onclick="closeModalOnBlank(event, 'section-modal')">
        <div class="bg-slate-900 border border-slate-700/80 p-6 rounded-2xl w-full max-w-md shadow-2xl text-slate-100" onclick="event.stopPropagation()">
            <h4 class="text-md font-semibold text-slate-200 mb-4 flex items-center"><i class="fas fa-layer-group mr-2 text-purple-400"></i><span id="section-modal-title">添加区域</span></h4>
            <div class="space-y-4 mb-6">
                <div>
                    <label class="text-xs text-slate-400 block mb-1.5 font-medium" data-i18n="sectionName">区域名称</label>
                    <input type="text" id="section-name" maxlength="40" placeholder="例如：AI 工具" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-purple-500">
                </div>
                <div>
                    <label class="text-xs text-slate-400 block mb-1.5 font-medium" data-i18n="sectionNameEn">英文名称（可选）</label>
                    <input type="text" id="section-name-en" maxlength="40" placeholder="e.g. AI Tools" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-purple-500">
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1.5 font-medium" data-i18n="sectionIcon">区域图标</label>
                        <input type="text" id="section-icon" maxlength="80" placeholder="fas fa-layer-group" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-purple-500">
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1.5 font-medium" data-i18n="sectionColor">主题颜色</label>
                        <select id="section-accent" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-purple-500">
                            <option value="indigo">靛蓝</option><option value="purple">紫色</option><option value="pink">粉色</option><option value="emerald">翠绿</option><option value="sky">天蓝</option><option value="amber">琥珀</option>
                        </select>
                    </div>
                </div>
                <div class="grid grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1.5 font-medium" data-i18n="sectionLayout">区域宽度</label>
                        <select id="section-layout" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-purple-500">
                            <option value="card" data-i18n="layoutCard">普通卡片</option>
                            <option value="wide" data-i18n="layoutWide">整行宽卡片</option>
                        </select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1.5 font-medium" data-i18n="linkStyle">网站样式</label>
                        <select id="section-link-style" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-100 focus:outline-none focus:border-purple-500">
                            <option value="icon" data-i18n="styleIcon">图标卡片</option>
                            <option value="text" data-i18n="styleText">文字链接</option>
                        </select>
                    </div>
                </div>
            </div>
            <div class="flex justify-end space-x-3">
                <button type="button" onclick="toggleModal('section-modal', false)" class="px-4 py-2 bg-slate-800 text-slate-400 text-xs font-medium rounded-xl hover:bg-slate-700 transition-colors cursor-pointer" data-i18n="btnCancel">取消</button>
                <button type="button" onclick="saveActiveSection()" class="px-4 py-2 bg-purple-600 text-white text-xs font-medium rounded-xl hover:bg-purple-500 transition-colors cursor-pointer" data-i18n="saveSection">保存区域</button>
            </div>
        </div>
    </div>

    <!-- 批量导入 / 导出 -->
    <div id="data-modal" class="fixed inset-0 bg-slate-950/70 backdrop-blur-sm hidden flex items-center justify-center p-4 z-[320]" onclick="closeModalOnBlank(event, 'data-modal')">
        <div class="modal-scroll bg-slate-900 border border-slate-700/80 p-6 rounded-2xl w-full max-w-2xl shadow-2xl text-slate-100" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-5">
                <h4 class="text-md font-semibold text-slate-200 flex items-center"><i class="fas fa-database mr-2 text-indigo-400"></i><span data-i18n="dataManageTitle">网站数据管理</span></h4>
                <button onclick="toggleModal('data-modal', false)" class="text-slate-500 hover:text-white"><i class="fas fa-times"></i></button>
            </div>

            <section class="space-y-4">
                <div class="flex items-center justify-between">
                    <h5 class="text-sm font-semibold text-indigo-300" data-i18n="batchImport">批量导入网站</h5>
                    <label class="text-xs px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 cursor-pointer border border-slate-700">
                        <i class="fas fa-folder-open mr-1"></i><span data-i18n="chooseFile">选择文件</span>
                        <input id="import-file" type="file" accept=".json,.csv,.tsv,.txt,.html" class="hidden" onchange="readImportFile(event)">
                    </label>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 gap-3">
                    <div>
                        <label class="text-xs text-slate-400 block mb-1.5" data-i18n="importTarget">导入到</label>
                        <select id="import-target" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-3 py-2 text-xs text-slate-100"></select>
                    </div>
                    <div>
                        <label class="text-xs text-slate-400 block mb-1.5" data-i18n="importMode">导入方式</label>

        function t(key) { return i18n[currentLang]?.[key] || i18n.zh[key] || key; }
        function uid(prefix = 'id') { return `${prefix}_${Date.now().toString(36)}_${Math.random().toString(36).slice(2, 8)}`; }
        function isAdmin() { return localStorage.getItem('nav_admin_auth') === 'true'; }
        function escapeHtml(value = '') { return String(value).replace(/[&<>'"]/g, ch => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[ch])); }
        function escapeAttr(value = '') { return escapeHtml(value).replace(/`/g, '&#96;'); }
        function sanitizeIconClass(value, fallback = '') { const cleaned = String(value || '').trim(); return /^[a-zA-Z0-9 _-]{0,80}$/.test(cleaned) ? cleaned : fallback; }
        function safeJsonParse(value, fallback) { try { return JSON.parse(value); } catch { return fallback; } }
        function clone(value) { return JSON.parse(JSON.stringify(value)); }
        function normalizeUrl(raw) {
            let value = String(raw || '').trim();
            if (!value) return null;
            if (!/^https?:\/\//i.test(value)) value = `https://${value}`;
            try { const url = new URL(value); if (!['http:', 'https:'].includes(url.protocol)) return null; return url.href; } catch { return null; }
        }
        function normalizedUrlKey(url) { try { const u = new URL(url); return `${u.hostname.replace(/^www\./, '').toLowerCase()}${u.pathname.replace(/\/$/, '')}${u.search}`; } catch { return String(url).toLowerCase(); } }
        function deriveNameFromUrl(url) { try { return new URL(url).hostname.replace(/^www\./, '').split('.')[0].replace(/[-_]+/g, ' ').replace(/\b\w/g, c => c.toUpperCase()); } catch { return 'Website'; } }

                    { id: uid('link'), name: '科技共享导航', nameEn: 'TechShare Nav', url: 'https://kjgx.168668520.xyz/', iconClass: '' }
                ]}
            ];
        }

        function normalizeLink(link) {
            const url = normalizeUrl(link?.url || link?.href);
            if (!url) return null;
            return { id: String(link?.id || uid('link')), name: String(link?.name || link?.title || deriveNameFromUrl(url)).slice(0, 60), nameEn: String(link?.nameEn || '').slice(0, 60), url, iconClass: sanitizeIconClass(link?.iconClass || link?.icon || '') };
        }

        function normalizeSection(section, index = 0) {
            const links = Array.isArray(section?.links) ? section.links.map(normalizeLink).filter(Boolean) : [];
            return {
                id: String(section?.id || uid('section')),
                title: String(section?.title || section?.name || `区域 ${index + 1}`).slice(0, 40),
                titleEn: String(section?.titleEn || '').slice(0, 40),
                icon: sanitizeIconClass(section?.icon, 'fas fa-layer-group'),
                accent: accentMap[section?.accent] ? section.accent : 'indigo',
                layout: section?.layout === 'wide' ? 'wide' : 'card',
                linkStyle: section?.linkStyle === 'text' ? 'text' : 'icon',
                links: dedupeLinks(links)
            };
        }

        function ensureUniqueIds(sections) {
            const sectionIds = new Set();
            const linkIds = new Set();
            return (Array.isArray(sections) ? sections : []).map((item, index) => {
                const section = normalizeSection(item, index);
                if (!section.id || sectionIds.has(section.id)) section.id = uid('section');
                sectionIds.add(section.id);
                section.links.forEach(link => {
                    if (!link.id || linkIds.has(link.id)) link.id = uid('link');
                    linkIds.add(link.id);
                });
                return section;
            });
        }

        function normalizeConfig(config) {
            const hasWallpaper = !!config && Object.prototype.hasOwnProperty.call(config, 'wallpaper');
            return {
                version: CONFIG_VERSION,
                wallpaper: hasWallpaper ? (typeof config.wallpaper === 'string' && config.wallpaper ? config.wallpaper : null) : undefined,
                adminPwd: typeof config?.adminPwd === 'string' ? config.adminPwd : '',
                sections: Array.isArray(config?.sections) ? ensureUniqueIds(config.sections) : [],
                updatedAt: typeof config?.updatedAt === 'string' ? config.updatedAt : ''
            };
        }

        function dedupeLinks(links) {
            const seen = new Set();
            return links.filter(link => { const key = normalizedUrlKey(link.url); if (seen.has(key)) return false; seen.add(key); return true; });
        }

        // ===================== 1. 初始化与旧数据迁移 =====================
        async function fetchJson(url, options = {}, timeout = 8000) {
            const controller = new AbortController();
            const timer = setTimeout(() => controller.abort(), timeout);
            try {
                const response = await fetch(url, { ...options, signal: controller.signal });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                return await response.json();
            } finally { clearTimeout(timer); }
        }

        async function loadLegacyCustomLinks() {
            let remoteLinks = [];
            try {
                const data = await fetchJson(LEGACY_LINKS_URL);
                if (Array.isArray(data)) remoteLinks = data.map(normalizeLink).filter(Boolean);
            } catch {}
            const local = safeJsonParse(localStorage.getItem('nav_custom_links') || '[]', []);
            const localLinks = Array.isArray(local) ? local.map(normalizeLink).filter(Boolean) : [];
            // 无损升级：云端为空时仍读取旧版浏览器数据；两端都有数据时按 URL 合并去重。
            return dedupeLinks([...remoteLinks, ...localLinks]);
        }

        function loadLegacyFriendLinks() {
            const local = safeJsonParse(localStorage.getItem('nav_friend_links') || '[]', []);
            return Array.isArray(local) ? local.map(normalizeLink).filter(Boolean) : [];
        }

        async function migrateLegacyConfig(remoteConfig = {}) {
            const sections = createDefaultSections();
            const customLinks = await loadLegacyCustomLinks();
            const friendLinks = loadLegacyFriendLinks();
            if (customLinks.length) sections.find(s => s.id === 'custom').links = dedupeLinks(customLinks);
            if (friendLinks.length) sections.find(s => s.id === 'friend').links = dedupeLinks(friendLinks);

            const legacyDynamic = Array.isArray(remoteConfig.dynamicSections)
                ? remoteConfig.dynamicSections
                : safeJsonParse(localStorage.getItem('nav_dynamic_sections') || '[]', []);
            if (Array.isArray(legacyDynamic)) {
                legacyDynamic.forEach((section, index) => sections.push(normalizeSection({ ...section, icon: section.icon || 'fas fa-layer-group', accent: section.accent || 'indigo', layout: 'card', linkStyle: 'icon' }, index)));
            }
            return { version: CONFIG_VERSION, wallpaper: Object.prototype.hasOwnProperty.call(remoteConfig, 'wallpaper') ? (remoteConfig.wallpaper || null) : undefined, adminPwd: remoteConfig.adminPwd || '', sections: ensureUniqueIds(sections), updatedAt: new Date().toISOString() };
        }

        async function initCloudData() {
            const savedTheme = localStorage.getItem('nav_theme_mode') || 'theme-dark';
            document.body.classList.remove('theme-light', 'theme-dark');
            document.body.classList.add(savedTheme);

            const localRaw = safeJsonParse(localStorage.getItem(STORAGE_KEY) || '{}', {});
            const localV2 = normalizeConfig(localRaw);
            const localHasSections = Array.isArray(localRaw?.sections);
            let remote = {};
            try { remote = await fetchJson(CLOUD_CONFIG_URL); } catch {}
            const remoteHasSections = Array.isArray(remote?.sections);

            let migrated = false;
            if (remoteHasSections) {
                const remoteV2 = normalizeConfig(remote);
                const remoteTime = Date.parse(remoteV2.updatedAt || '');
                const localTime = Date.parse(localV2.updatedAt || '');
                siteConfig = localHasSections && Number.isFinite(localTime) && Number.isFinite(remoteTime) && localTime > remoteTime ? localV2 : remoteV2;
            } else if (localHasSections) {
                siteConfig = localV2;
                if (Object.prototype.hasOwnProperty.call(remote, 'wallpaper')) siteConfig.wallpaper = remote.wallpaper || null;
                if (typeof remote?.adminPwd === 'string' && remote.adminPwd) siteConfig.adminPwd = remote.adminPwd;
            } else {
                siteConfig = await migrateLegacyConfig(remote);
                migrated = true;
            }
            applyConfiguredWallpaper();
            persistLocal();
            dataReady = true;
            renderSections();
            refreshImportSectionOptions();
            checkAdminSession();
            if (migrated) { showToast(t('migrated'), 'success'); scheduleCloudSync(200); }
        }

        function persistLocal() {
            siteConfig.updatedAt = new Date().toISOString();
            localStorage.setItem(STORAGE_KEY, JSON.stringify(siteConfig));
            mirrorLegacyLocalStores();
        }

        function mirrorLegacyLocalStores() {
            const custom = siteConfig.sections.find(s => s.id === 'custom');
            const friend = siteConfig.sections.find(s => s.id === 'friend');
            if (custom) localStorage.setItem('nav_custom_links', JSON.stringify(custom.links.map(({name, url}) => ({name, url}))));
            if (friend) localStorage.setItem('nav_friend_links', JSON.stringify(friend.links.map(({name, url}) => ({name, url}))));
            const dynamic = siteConfig.sections.filter(s => !['recommend', 'develop', 'custom', 'friend'].includes(s.id)).map(s => ({ id: s.id, title: s.title, links: s.links.map(({name, url}) => ({name, url})) }));
            localStorage.setItem('nav_dynamic_sections', JSON.stringify(dynamic));
        }

        function commitConfig(message = '', immediate = false) {
            persistLocal();
            renderSections();
            refreshImportSectionOptions();
            if (message) showToast(message, 'success');
            scheduleCloudSync(immediate ? 0 : 500);
        }

        function scheduleCloudSync(delay = 500) {
            clearTimeout(syncTimer);
            setSyncBadge(t('localSaved'));
            syncTimer = setTimeout(syncCloudNow, delay);
        }

        async function syncCloudNow() {
            syncTimer = null;
            if (syncInFlight) { scheduleCloudSync(700); return; }
            syncInFlight = true;
            try {
                // 同时写入新版 sections 与旧版 dynamicSections，便于紧急回滚旧代码时继续识别原有区域。
                const legacyDynamicSections = siteConfig.sections
                    .filter(section => !['recommend', 'develop', 'custom', 'friend'].includes(section.id))
                    .map(section => ({ id: section.id, title: section.title, links: section.links.map(({ name, url }) => ({ name, url })) }));
                const cloudPayload = { ...siteConfig, dynamicSections: legacyDynamicSections };
                const response = await fetch(CLOUD_CONFIG_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(cloudPayload) });
                if (!response.ok) throw new Error(`HTTP ${response.status}`);
                const custom = siteConfig.sections.find(s => s.id === 'custom');
                if (custom) fetch(LEGACY_LINKS_URL, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(custom.links.map(({name, url}) => ({name, url}))) }).catch(() => {});
                setSyncBadge(t('cloudSynced'));
            } catch (error) {
                console.error('Cloud sync failed:', error);
                setSyncBadge(t('cloudFailed'), true);
            } finally { syncInFlight = false; }
        }

        function setSyncBadge(text, failed = false) {
            const badge = document.getElementById('sync-badge');
            if (!badge) return;
            badge.textContent = `· ${text}`;
            badge.className = `admin-only ml-1 text-[10px] ${failed ? 'text-red-400' : 'text-slate-500'}`;
        }

        // ===================== 2. 多语言与主题 =====================
        function setLanguage(lang) {
            currentLang = lang === 'en' ? 'en' : 'zh';
            localStorage.setItem('nav_lang', currentLang);
            document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
            applyLanguage();
            updateClockAndGreeting();
            renderWeather();
            selectEngine(currentEngineKey);
            document.getElementById('theme-panel').classList.add('hidden');
        }

        function applyLanguage() {
            document.title = t('pageTitle');
            document.querySelectorAll('[data-i18n]').forEach(el => { el.innerHTML = t(el.dataset.i18n); });
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => { el.placeholder = t(el.dataset.i18nPlaceholder); });
            if (dataReady) { renderSections(); refreshImportSectionOptions(); }
        }

        function toggleThemeMenu(event) { event.stopPropagation(); document.getElementById('theme-panel').classList.toggle('hidden'); }
        function setBaseTheme(theme) { document.body.classList.remove('theme-light', 'theme-dark'); document.body.classList.add(theme); localStorage.setItem('nav_theme_mode', theme); document.getElementById('theme-panel').classList.add('hidden'); }
        function applyWallpaperStyles(url) { document.body.style.backgroundImage = `url("${String(url).replace(/["\\]/g, '\\$&')}")`; document.body.style.backgroundPosition = 'center'; document.body.style.backgroundSize = 'cover'; document.body.style.backgroundRepeat = 'no-repeat'; document.body.style.backgroundAttachment = 'fixed'; document.body.classList.add('has-custom-bg'); }
        function applyConfiguredWallpaper() {
            const defaultBg = 'https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?q=80&w=2564&auto=format&fit=crop';
            const url = siteConfig.wallpaper === undefined ? defaultBg : (typeof siteConfig.wallpaper === 'string' ? siteConfig.wallpaper : '');
            if (url) { applyWallpaperStyles(url); document.getElementById('custom-bg-input').value = url; document.getElementById('clear-bg-btn').classList.remove('hidden'); }
            else { document.body.style.backgroundImage = ''; document.body.classList.remove('has-custom-bg'); document.getElementById('custom-bg-input').value = ''; document.getElementById('clear-bg-btn').classList.add('hidden'); }
        }
        function applyCustomBg() { const url = normalizeUrl(document.getElementById('custom-bg-input').value); if (!url) return showToast(t('invalidUrl'), 'error'); siteConfig.wallpaper = url; applyWallpaperStyles(url); document.getElementById('clear-bg-btn').classList.remove('hidden'); document.getElementById('theme-panel').classList.add('hidden'); commitConfig(t('updated')); }
        function clearCustomBg() { siteConfig.wallpaper = null; document.body.style.backgroundImage = ''; document.body.classList.remove('has-custom-bg'); document.getElementById('custom-bg-input').value = ''; document.getElementById('clear-bg-btn').classList.add('hidden'); document.getElementById('theme-panel').classList.add('hidden'); commitConfig(t('updated')); }

        // ===================== 3. 管理员模式 =====================
        function checkAdminSession() {
            document.body.classList.toggle('is-admin', isAdmin());
            document.getElementById('admin-badge').classList.toggle('hidden', !isAdmin());
            if (dataReady) renderSections();
        }
        function triggerAdminLogin() {
            if (isAdmin()) return showToast(t('alreadyAdmin'));
            const password = prompt(t('pwdPrompt'));
            if (password === null) return;
            if (password === (siteConfig.adminPwd || DEFAULT_ADMIN_PASSWORD)) { localStorage.setItem('nav_admin_auth', 'true'); alert(t('pwdSuccess')); checkAdminSession(); }
            else alert(t('pwdFail'));
        }
        function logoutAdmin() { localStorage.removeItem('nav_admin_auth'); expandedSections = {}; alert(t('logoutMsg')); checkAdminSession(); document.getElementById('theme-panel').classList.add('hidden'); }
        function updateAdminPwd() { const value = document.getElementById('custom-pwd-input').value.trim(); if (!value) return; siteConfig.adminPwd = value; document.getElementById('custom-pwd-input').value = ''; document.getElementById('theme-panel').classList.add('hidden'); commitConfig(t('pwdUpdateSuccess'), true); }

        // ===================== 4. 区域和网站渲染 =====================
        function getSectionTitle(section) { return currentLang === 'en' && section.titleEn ? section.titleEn : section.title; }
        function getLinkName(link) { return currentLang === 'en' && link.nameEn ? link.nameEn : link.name; }
        function getFavicon(url) { try { return `https://unavatar.io/duckduckgo/${encodeURIComponent(new URL(url).hostname)}`; } catch { return ''; } }

        function renderSections() {
            const grid = document.getElementById('main-nav-grid');
            if (!grid) return;
            grid.innerHTML = '';
            siteConfig.sections.forEach(section => grid.appendChild(createSectionCard(section)));
            if (isAdmin()) grid.appendChild(createAddSectionCard());
        }

        function createAddSectionCard() {
            const card = document.createElement('button');
            card.type = 'button';
            card.className = 'admin-only glass-card rounded-2xl p-6 flex flex-col items-center justify-center cursor-pointer hover:border-indigo-500/50 transition-all border-dashed border-2 border-slate-500/30 xl:col-span-1';
            card.style.minHeight = '180px';
            card.innerHTML = `<i class="fas fa-plus text-3xl text-slate-400 mb-2"></i><span class="text-sm font-medium text-slate-400 mt-1">${escapeHtml(t('addSectionBtn'))}</span>`;
            card.addEventListener('click', () => openSectionModal());
            return card;
        }

        function createSectionCard(section) {
            const accent = accentMap[section.accent] || accentMap.indigo;
            const isWide = section.layout === 'wide';
            const card = document.createElement('section');
            card.id = `section-${section.id}`;
            card.dataset.sectionId = section.id;
            card.className = `glass-card rounded-2xl p-6 shadow-xl ${accent.hover} transition-all duration-300 relative ${isWide ? 'xl:col-span-3' : 'xl:col-span-1'}`;
            card.addEventListener('dragover', event => handleSectionDragOver(event, section.id));
            card.addEventListener('dragleave', event => { if (!card.contains(event.relatedTarget)) card.classList.remove('drop-target'); });
            card.addEventListener('drop', event => handleDropOnSection(event, section.id));

            const header = document.createElement('div');
            header.className = 'flex justify-between items-center mb-4 gap-2';
            const title = document.createElement('h3');
            title.className = `${isWide ? 'text-base' : 'text-lg'} font-semibold ${accent.text} flex items-center min-w-0`;
            title.innerHTML = `${isAdmin() ? `<i class="section-drag-handle fas fa-grip-vertical mr-2 text-slate-500 opacity-60 text-sm cursor-grab" draggable="true" title="拖拽区域排序"></i>` : ''}<i class="${escapeAttr(sanitizeIconClass(section.icon, 'fas fa-layer-group'))} mr-2.5"></i><span class="truncate">${escapeHtml(getSectionTitle(section))}</span>`;
            const sectionHandle = title.querySelector('.section-drag-handle');
            if (sectionHandle) {
                sectionHandle.addEventListener('dragstart', event => startSectionDrag(event, section.id));
                sectionHandle.addEventListener('dragend', endDrag);
            }

            const actions = document.createElement('div');
            actions.className = 'admin-only flex gap-1.5 shrink-0';
            actions.innerHTML = `
                <button type="button" class="add-link-btn text-[10px] px-2 py-1 ${accent.soft} ${accent.text} border ${accent.border} rounded-md hover:brightness-125"><i class="fas fa-plus mr-1"></i>${escapeHtml(t('addSite'))}</button>
                <button type="button" class="edit-section-btn text-[10px] px-2 py-1 bg-sky-600/20 text-sky-400 border border-sky-500/20 rounded-md hover:bg-sky-600/40" title="${escapeAttr(t('edit'))}"><i class="fas fa-pen"></i></button>
                <button type="button" class="delete-section-btn text-[10px] px-2 py-1 bg-red-600/20 text-red-400 border border-red-500/20 rounded-md hover:bg-red-600/40" title="${escapeAttr(t('delete'))}"><i class="fas fa-trash"></i></button>`;
            actions.querySelector('.add-link-btn').addEventListener('click', () => openLinkModal(section.id));
            actions.querySelector('.edit-section-btn').addEventListener('click', () => openSectionModal(section.id));
            actions.querySelector('.delete-section-btn').addEventListener('click', () => deleteSection(section.id));
            header.append(title, actions);

            const linksGrid = document.createElement('div');
            const compact = section.links.length > 6;
            if (section.linkStyle === 'text') linksGrid.className = 'grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-6 gap-3';
            else linksGrid.className = compact ? 'grid grid-cols-2 sm:grid-cols-3 gap-2' : 'grid grid-cols-2 gap-3';
            linksGrid.style.minHeight = '40px';
            linksGrid.addEventListener('dragover', event => handleSectionDragOver(event, section.id));
            linksGrid.addEventListener('drop', event => handleDropOnSection(event, section.id));

            const expanded = !!expandedSections[section.id];
            const visibleLinks = section.links.length > 9 && !expanded ? section.links.slice(0, 9) : section.links;
            if (!visibleLinks.length) {
                const empty = document.createElement('div');
                empty.className = 'col-span-full text-center text-xs text-slate-400/60 py-6';
                empty.textContent = t('noCloudLinks');
                linksGrid.appendChild(empty);
            } else {
                visibleLinks.forEach(link => linksGrid.appendChild(createLinkItem(section, link, compact, accent)));
            }

            card.append(header, linksGrid);
            if (section.links.length > 9) {
                const expandWrap = document.createElement('div');
                expandWrap.className = 'mt-4 pt-2 border-t border-slate-500/10 text-center';
                const button = document.createElement('button');
                button.type = 'button';
                button.className = `text-xs font-semibold ${accent.text} hover:brightness-125 transition-colors inline-flex items-center gap-1`;
                button.innerHTML = expanded ? `${escapeHtml(t('collapseMore'))} <i class="fas fa-chevron-up text-[10px]"></i>` : `${escapeHtml(t('expandMore'))} (${section.links.length - 9}) <i class="fas fa-chevron-down text-[10px]"></i>`;
                button.addEventListener('click', () => { expandedSections[section.id] = !expanded; renderSections(); });
                expandWrap.appendChild(button);
                card.appendChild(expandWrap);
            }
            return card;
        }

        function createLinkItem(section, link, compact, accent) {
            const wrapper = document.createElement('div');
            wrapper.dataset.linkId = link.id;
            wrapper.className = `group relative flex items-center justify-between ${section.linkStyle === 'text' ? 'p-2.5 text-center' : compact ? 'p-2' : 'p-3'} bg-slate-500/5 border border-slate-500/10 rounded-xl ${accent.hoverBg} transition-all`;
            wrapper.draggable = isAdmin();
            if (isAdmin()) {
                wrapper.addEventListener('dragstart', event => startLinkDrag(event, section.id, link.id));
                wrapper.addEventListener('dragend', endDrag);
                wrapper.addEventListener('dragover', event => handleLinkDragOver(event));
                wrapper.addEventListener('drop', event => handleDropOnLink(event, section.id, link.id));
            }

            const anchor = document.createElement('a');
            anchor.href = link.url;
            anchor.target = '_blank';
            anchor.rel = 'noopener noreferrer';
            anchor.draggable = false;
            if (section.linkStyle === 'text') {
                anchor.className = `w-full text-xs font-medium text-slate-400 ${accent.text.replace('text-', 'hover:text-')} transition-colors truncate px-2`;
                anchor.textContent = getLinkName(link);
            } else {
                anchor.className = `flex items-center ${compact ? 'space-x-1.5 pr-12' : 'space-x-3 pr-12'} truncate w-full`;
                const iconHtml = link.iconClass
                    ? `<i class="${escapeAttr(sanitizeIconClass(link.iconClass))} ${compact ? 'text-base' : 'text-xl'} shrink-0"></i>`
                    : `<img src="${escapeAttr(getFavicon(link.url))}" draggable="false" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'" class="${compact ? 'w-4 h-4' : 'w-5 h-5'} rounded object-contain shrink-0" alt=""><span style="display:none" class="${compact ? 'w-4 h-4 text-[9px]' : 'w-5 h-5 text-[10px]'} rounded-full bg-indigo-500/20 text-indigo-400 items-center justify-center font-bold shrink-0">${escapeHtml(getLinkName(link).charAt(0).toUpperCase())}</span>`;
                anchor.innerHTML = `${iconHtml}<span class="${compact ? 'text-[11px]' : 'text-sm'} font-medium truncate">${escapeHtml(getLinkName(link))}</span>`;
            }

            const controls = document.createElement('div');
            controls.className = `admin-only absolute right-1 top-1/2 -translate-y-1/2 flex gap-1 opacity-0 group-hover:opacity-100 transition-opacity rounded-lg bg-slate-900/80 p-0.5`;
            controls.innerHTML = `<button type="button" class="edit-link text-[10px] text-sky-400 hover:text-sky-300 px-1.5 py-1" title="${escapeAttr(t('edit'))}"><i class="fas fa-pen"></i></button><button type="button" class="delete-link text-[10px] text-red-400 hover:text-red-300 px-1.5 py-1" title="${escapeAttr(t('delete'))}"><i class="fas fa-trash-alt"></i></button>`;
            controls.querySelector('.edit-link').addEventListener('click', event => { event.preventDefault(); event.stopPropagation(); openLinkModal(section.id, link.id); });
            controls.querySelector('.delete-link').addEventListener('click', event => { event.preventDefault(); event.stopPropagation(); deleteLink(section.id, link.id); });
            wrapper.append(anchor, controls);
            return wrapper;
        }

        // ===================== 5. 区域与网站增删改 =====================
        function toggleModal(id, show) { document.getElementById(id).classList.toggle('hidden', !show); }
        function closeModalOnBlank(event, id) { if (event.target.id === id) toggleModal(id, false); }

        function openLinkModal(sectionId, linkId = null) {
            const section = siteConfig.sections.find(item => item.id === sectionId);
            if (!section) return;
            const link = linkId ? section.links.find(item => item.id === linkId) : null;
            activeLinkEditor = { sectionId, linkId };
            document.getElementById('link-modal-title').textContent = link ? `${t('edit')}：${getLinkName(link)}` : `${t('addSite')}：${getSectionTitle(section)}`;
            document.getElementById('site-name').value = link?.name || '';
            document.getElementById('site-name-en').value = link?.nameEn || '';
            document.getElementById('site-url').value = link?.url || '';
            document.getElementById('site-icon').value = link?.iconClass || '';
            toggleModal('link-modal', true);
            setTimeout(() => document.getElementById('site-name').focus(), 50);
        }

        function saveActiveLink() {
            const section = siteConfig.sections.find(item => item.id === activeLinkEditor.sectionId);
            if (!section) return;
            const name = document.getElementById('site-name').value.trim();
            const nameEn = document.getElementById('site-name-en').value.trim();
            const url = normalizeUrl(document.getElementById('site-url').value);
            const iconClass = sanitizeIconClass(document.getElementById('site-icon').value);
            if (!name || !url) return showToast(!name ? t('requiredFields') : t('invalidUrl'), 'error');

            if (activeLinkEditor.linkId) {
                const link = section.links.find(item => item.id === activeLinkEditor.linkId);
                if (!link) return;
                Object.assign(link, { name: name.slice(0, 60), nameEn: nameEn.slice(0, 60), url, iconClass });
                commitConfig(t('updated'));
            } else {
                section.links.push({ id: uid('link'), name: name.slice(0, 60), nameEn: nameEn.slice(0, 60), url, iconClass });
                section.links = dedupeLinks(section.links);
                expandedSections[section.id] = true;
                commitConfig(t('added'));
            }
            toggleModal('link-modal', false);
        }

        function deleteLink(sectionId, linkId) {
            if (!confirm(t('confirmDeleteLink'))) return;
            const section = siteConfig.sections.find(item => item.id === sectionId);
            if (!section) return;
            section.links = section.links.filter(item => item.id !== linkId);
            commitConfig(t('deleted'));
        }

        function openSectionModal(sectionId = null) {
            const section = sectionId ? siteConfig.sections.find(item => item.id === sectionId) : null;
            activeSectionEditorId = sectionId;
            document.getElementById('section-modal-title').textContent = section ? `${t('edit')}：${getSectionTitle(section)}` : t('addSectionBtn');
            document.getElementById('section-name').value = section?.title || '';
            document.getElementById('section-name-en').value = section?.titleEn || '';
            document.getElementById('section-icon').value = section?.icon || 'fas fa-layer-group';
            document.getElementById('section-accent').value = section?.accent || 'indigo';
            document.getElementById('section-layout').value = section?.layout || 'card';
            document.getElementById('section-link-style').value = section?.linkStyle || 'icon';
            toggleModal('section-modal', true);
            setTimeout(() => document.getElementById('section-name').focus(), 50);
        }

        function saveActiveSection() {
            const title = document.getElementById('section-name').value.trim();
            if (!title) return showToast(t('requiredSection'), 'error');
            const data = {
                title: title.slice(0, 40),
                titleEn: document.getElementById('section-name-en').value.trim().slice(0, 40),
                icon: sanitizeIconClass(document.getElementById('section-icon').value, 'fas fa-layer-group'),
                accent: accentMap[document.getElementById('section-accent').value] ? document.getElementById('section-accent').value : 'indigo',
                layout: document.getElementById('section-layout').value === 'wide' ? 'wide' : 'card',
                linkStyle: document.getElementById('section-link-style').value === 'text' ? 'text' : 'icon'
            };
            if (activeSectionEditorId) {
                const section = siteConfig.sections.find(item => item.id === activeSectionEditorId);
                if (!section) return;
                Object.assign(section, data);
                commitConfig(t('updated'));
            } else {
                siteConfig.sections.push({ id: uid('section'), ...data, links: [] });
                commitConfig(t('added'));
            }
            toggleModal('section-modal', false);
        }

        function deleteSection(sectionId) {
            const section = siteConfig.sections.find(item => item.id === sectionId);
            if (!section || !confirm(`${t('confirmDeleteSection')}\n\n${getSectionTitle(section)} (${section.links.length})`)) return;
            siteConfig.sections = siteConfig.sections.filter(item => item.id !== sectionId);
            delete expandedSections[sectionId];
            commitConfig(t('deleted'));
        }

        // ===================== 6. 拖拽排序（区域、区域内网站、跨区域网站） =====================
        function startSectionDrag(event, sectionId) { event.stopPropagation(); dragState = { type: 'section', sectionId }; event.dataTransfer.effectAllowed = 'move'; event.dataTransfer.setData('text/plain', sectionId); event.currentTarget.closest('section')?.classList.add('dragging'); }
        function startLinkDrag(event, sectionId, linkId) { event.stopPropagation(); dragState = { type: 'link', sectionId, linkId }; event.dataTransfer.effectAllowed = 'move'; event.dataTransfer.setData('text/plain', linkId); event.currentTarget.classList.add('dragging'); }
        function endDrag(event) { event.currentTarget.closest('.dragging')?.classList.remove('dragging'); document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target')); setTimeout(() => { dragState = null; }, 0); }
        function handleSectionDragOver(event) { if (!dragState) return; event.preventDefault(); event.stopPropagation(); event.currentTarget.closest('section')?.classList.add('drop-target'); event.dataTransfer.dropEffect = 'move'; }
        function handleLinkDragOver(event) { if (dragState?.type !== 'link') return; event.preventDefault(); event.stopPropagation(); event.currentTarget.classList.add('drop-target'); event.dataTransfer.dropEffect = 'move'; }

        function handleDropOnSection(event, targetSectionId) {
            if (!dragState) return;
            event.preventDefault(); event.stopPropagation();
            document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
            if (dragState.type === 'section') reorderSection(dragState.sectionId, targetSectionId);
            else moveLink(dragState.sectionId, dragState.linkId, targetSectionId, null);
        }
        function handleDropOnLink(event, targetSectionId, targetLinkId) {
            if (dragState?.type !== 'link') return;
            event.preventDefault(); event.stopPropagation();
            document.querySelectorAll('.drop-target').forEach(el => el.classList.remove('drop-target'));
            moveLink(dragState.sectionId, dragState.linkId, targetSectionId, targetLinkId);
        }
        function reorderSection(fromId, toId) {
            if (fromId === toId) return;
            const fromIndex = siteConfig.sections.findIndex(item => item.id === fromId);
            const toIndex = siteConfig.sections.findIndex(item => item.id === toId);
            if (fromIndex < 0 || toIndex < 0) return;
            const [moved] = siteConfig.sections.splice(fromIndex, 1);
            const adjusted = fromIndex < toIndex ? toIndex - 1 : toIndex;
            siteConfig.sections.splice(adjusted, 0, moved);
            commitConfig(t('updated'));
        }
        function moveLink(fromSectionId, linkId, toSectionId, targetLinkId) {
            const fromSection = siteConfig.sections.find(item => item.id === fromSectionId);
            const toSection = siteConfig.sections.find(item => item.id === toSectionId);
            if (!fromSection || !toSection) return;
            const fromIndex = fromSection.links.findIndex(item => item.id === linkId);
            if (fromIndex < 0 || (fromSectionId === toSectionId && linkId === targetLinkId)) return;
            const [moved] = fromSection.links.splice(fromIndex, 1);
            let insertIndex = targetLinkId ? toSection.links.findIndex(item => item.id === targetLinkId) : toSection.links.length;
            if (insertIndex < 0) insertIndex = toSection.links.length;
            toSection.links.splice(insertIndex, 0, moved);
            expandedSections[toSectionId] = true;
            commitConfig(t('updated'));
        }

        // ===================== 7. 批量导入与导出 =====================
        function openDataModal() { refreshImportSectionOptions(); document.getElementById('theme-panel').classList.add('hidden'); toggleModal('data-modal', true); }
        function refreshImportSectionOptions() {
            const select = document.getElementById('import-target');
            if (!select) return;
            const previous = select.value;
            select.innerHTML = `<option value="__auto__">${escapeHtml(t('autoBySection'))}</option>` + siteConfig.sections.map(section => `<option value="${escapeAttr(section.id)}">${escapeHtml(getSectionTitle(section))}</option>`).join('');
            if ([...select.options].some(option => option.value === previous)) select.value = previous;
        }
        async function readImportFile(event) {
            const file = event.target.files?.[0];
            if (!file) return;
            try { document.getElementById('import-text').value = await file.text(); }
            catch { showToast(t('fileReadFailed'), 'error'); }
            finally { event.target.value = ''; }
        }

        function parseImportContent(text) {
            const raw = String(text || '').trim();
            if (!raw) return { sections: [] };

            // JSON：支持本工具备份、区域数组、网站数组
            if (/^[\[{]/.test(raw)) {
                try {
                    const json = JSON.parse(raw);
                    if (json && Array.isArray(json.sections)) return { sections: ensureUniqueIds(json.sections), wallpaper: typeof json.wallpaper === 'string' || json.wallpaper === null ? json.wallpaper : undefined, fullBackup: true };
                    if (Array.isArray(json) && json.some(item => Array.isArray(item?.links))) return { sections: ensureUniqueIds(json), fullBackup: true };
                    if (Array.isArray(json)) return { sections: [{ id: uid('section'), title: '批量导入', titleEn: 'Imported', icon: 'fas fa-file-import', accent: 'indigo', layout: 'card', linkStyle: 'icon', links: json.map(normalizeLink).filter(Boolean) }] };
                } catch {}
            }

            // 浏览器书签 HTML
            if (/<a\s/i.test(raw) && /href\s*=\s*/i.test(raw)) {
                const parser = new DOMParser();
                const doc = parser.parseFromString(raw, 'text/html');
                const groups = new Map();
                doc.querySelectorAll('a[href]').forEach(anchor => {
                    const url = normalizeUrl(anchor.getAttribute('href'));
                    if (!url) return;
                    let folder = '浏览器书签';
                    const dl = anchor.closest('dl');
                    const heading = dl?.previousElementSibling;
                    if (heading && /^H[1-6]$/.test(heading.tagName)) folder = heading.textContent.trim() || folder;
                    if (!groups.has(folder)) groups.set(folder, []);
                    groups.get(folder).push(normalizeLink({ name: anchor.textContent.trim() || deriveNameFromUrl(url), url }));
                });
                return { sections: [...groups].map(([title, links]) => normalizeSection({ title, titleEn: '', icon: 'fas fa-bookmark', accent: 'amber', layout: 'card', linkStyle: 'icon', links })) };
            }

            // CSV / TSV / 常见文本格式
            const delimiter = raw.includes('\t') ? '\t' : ',';
            const rows = parseDelimited(raw, delimiter);
            const first = rows[0]?.map(cell => cell.trim().toLowerCase()) || [];
            const hasHeader = first.some(cell => ['url', '网址', '链接', 'name', '网站名称', 'section', '区域', '分类'].includes(cell));
            let sectionIndex = first.findIndex(cell => ['section', '区域', '分类', 'folder'].includes(cell));
            let nameIndex = first.findIndex(cell => ['name', '网站名称', '名称', 'title'].includes(cell));
            let nameEnIndex = first.findIndex(cell => ['nameen', 'english name', '英文名称'].includes(cell));
            let urlIndex = first.findIndex(cell => ['url', '网址', '链接', 'href'].includes(cell));
            const groups = new Map();

            const dataRows = hasHeader ? rows.slice(1) : rows;
            dataRows.forEach(row => {
                let sectionName = '批量导入', name = '', nameEn = '', rawUrl = '';
                if (hasHeader && urlIndex >= 0) {
                    sectionName = sectionIndex >= 0 ? row[sectionIndex]?.trim() || sectionName : sectionName;
                    name = nameIndex >= 0 ? row[nameIndex]?.trim() : '';
                    nameEn = nameEnIndex >= 0 ? row[nameEnIndex]?.trim() : '';
                    rawUrl = row[urlIndex]?.trim();
                } else {
                    const joined = row.join(delimiter).trim();
                    const parts = joined.includes('|') ? joined.split('|').map(v => v.trim()) : row.map(v => v.trim());
                    const urlPartIndex = parts.findIndex(v => /^https?:\/\//i.test(v) || /^[\w.-]+\.[a-z]{2,}(?:\/|$)/i.test(v));
                    if (urlPartIndex >= 0) { rawUrl = parts[urlPartIndex]; name = parts.find((_, i) => i !== urlPartIndex) || ''; }
                }
                const url = normalizeUrl(rawUrl);
                if (!url) return;
                if (!groups.has(sectionName)) groups.set(sectionName, []);
                groups.get(sectionName).push(normalizeLink({ name: name || deriveNameFromUrl(url), nameEn, url }));
            });
            return { sections: [...groups].map(([title, links]) => normalizeSection({ title, titleEn: '', icon: 'fas fa-file-import', accent: 'indigo', layout: 'card', linkStyle: 'icon', links })) };
        }

        function parseDelimited(text, delimiter = ',') {
            const rows = []; let row = [], cell = '', quoted = false;
            for (let i = 0; i < text.length; i++) {
                const char = text[i];
                if (quoted) {
                    if (char === '"' && text[i + 1] === '"') { cell += '"'; i++; }
                    else if (char === '"') quoted = false;
                    else cell += char;
                } else if (char === '"') quoted = true;
                else if (char === delimiter) { row.push(cell); cell = ''; }
                else if (char === '\n') { row.push(cell.replace(/\r$/, '')); rows.push(row); row = []; cell = ''; }
                else cell += char;
            }
            row.push(cell.replace(/\r$/, ''));
            if (row.some(value => value.trim())) rows.push(row);
            return rows.filter(rowItem => rowItem.some(value => value.trim()));
        }

        function countImportedLinks(sections) { return sections.reduce((sum, section) => sum + section.links.length, 0); }
        function mergeLinks(existing, incoming) { return dedupeLinks([...existing, ...incoming]); }

        function runBatchImport() {
            const text = document.getElementById('import-text').value;
            let parsed;
            try { parsed = parseImportContent(text); } catch (error) { console.error(error); return showToast(t('invalidImport'), 'error'); }
            const count = countImportedLinks(parsed.sections || []);
            if (!count) return showToast(t('noImportData'), 'error');
            if (count > MAX_IMPORT_LINKS) return showToast(t('tooManyLinks'), 'error');

            const target = document.getElementById('import-target').value;
            const mode = document.getElementById('import-mode').value;
            if (mode === 'replace-all') {
                if (!confirm(t('confirmReplaceAll'))) return;
                siteConfig.sections = parsed.sections.map(normalizeSection);
                if (parsed.wallpaper !== undefined) siteConfig.wallpaper = parsed.wallpaper;
                applyConfiguredWallpaper();
            } else if (target !== '__auto__') {
                const section = siteConfig.sections.find(item => item.id === target);
                if (!section) return;
                const incoming = parsed.sections.flatMap(item => item.links);
                section.links = mode === 'replace-target' ? dedupeLinks(incoming) : mergeLinks(section.links, incoming);
                expandedSections[section.id] = true;
            } else {
                parsed.sections.forEach(importedSection => {
                    let existing = siteConfig.sections.find(item => item.id === importedSection.id || item.title.toLowerCase() === importedSection.title.toLowerCase());
                    if (!existing) { existing = normalizeSection({ ...importedSection, id: uid('section') }); siteConfig.sections.push(existing); }
                    else if (mode === 'replace-target') existing.links = dedupeLinks(importedSection.links);
                    else existing.links = mergeLinks(existing.links, importedSection.links);
                    expandedSections[existing.id] = true;
                });
            }
            commitConfig(`${t('imported')}：${count}` , true);
            document.getElementById('import-text').value = '';
        }

        function csvEscape(value) { const str = String(value ?? ''); return /[",\n\r]/.test(str) ? `"${str.replace(/"/g, '""')}"` : str; }
        function exportData(format) {
            const date = new Date().toISOString().slice(0, 10);
            if (format === 'json') {
                const backup = { version: CONFIG_VERSION, exportedAt: new Date().toISOString(), wallpaper: siteConfig.wallpaper, sections: clone(siteConfig.sections) };
                downloadBlob(`科技共享导航备份_${date}.json`, JSON.stringify(backup, null, 2), 'application/json;charset=utf-8');
            } else if (format === 'csv') {
                const rows = [['区域', '区域英文名', '网站名称', '英文名称', '网址']];
                siteConfig.sections.forEach(section => section.links.forEach(link => rows.push([section.title, section.titleEn, link.name, link.nameEn, link.url])));
                const csv = '\ufeff' + rows.map(row => row.map(csvEscape).join(',')).join('\r\n');
                downloadBlob(`科技共享导航网站_${date}.csv`, csv, 'text/csv;charset=utf-8');
            } else if (format === 'html') {
                const folders = siteConfig.sections.map(section => `    <DT><H3>${escapeHtml(section.title)}</H3>\n    <DL><p>\n${section.links.map(link => `        <DT><A HREF="${escapeAttr(link.url)}">${escapeHtml(link.name)}</A>`).join('\n')}\n    </DL><p>`).join('\n');
                const html = `<!DOCTYPE NETSCAPE-Bookmark-file-1>\n<META HTTP-EQUIV="Content-Type" CONTENT="text/html; charset=UTF-8">\n<TITLE>科技共享导航书签</TITLE>\n<H1>科技共享导航书签</H1>\n<DL><p>\n${folders}\n</DL><p>`;
                downloadBlob(`科技共享导航书签_${date}.html`, html, 'text/html;charset=utf-8');
            }
            showToast(t('exported'), 'success');
        }
        function downloadBlob(filename, content, mime) { const blob = new Blob([content], { type: mime }); const url = URL.createObjectURL(blob); const anchor = document.createElement('a'); anchor.href = url; anchor.download = filename; document.body.appendChild(anchor); anchor.click(); anchor.remove(); setTimeout(() => URL.revokeObjectURL(url), 1000); }

        // ===================== 8. 搜索、时钟、天气 =====================
        const engines = {
            google: { action: 'https://www.google.com/search', name: 'q', placeholderKey: 'searchGoogle', icon: 'fab fa-google text-blue-400' },
            bing: { action: 'https://cn.bing.com/search', name: 'q', placeholderKey: 'searchBing', icon: 'fab fa-microsoft text-teal-400' },
            baidu: { action: 'https://www.baidu.com/s', name: 'wd', placeholderKey: 'searchBaidu', icon: 'fas fa-paw text-red-400' },
            github: { action: 'https://github.com/search', name: 'q', placeholderKey: 'searchGithub', icon: 'fab fa-github text-slate-400' }
        };
        function toggleEngineMenu(event) { event.stopPropagation(); document.getElementById('engine-menu').classList.toggle('hidden'); }
        function selectEngine(key) { if (!engines[key]) key = 'google'; currentEngineKey = key; localStorage.setItem('nav_engine', key); const form = document.getElementById('search-form'); const input = document.getElementById('search-input'); form.action = engines[key].action; input.name = engines[key].name; input.placeholder = t(engines[key].placeholderKey); document.getElementById('engine-icon').className = engines[key].icon; document.getElementById('engine-menu').classList.add('hidden'); }

        const sTermNames = ['小寒','大寒','立春','雨水','惊蛰','春分','清明','谷雨','立夏','小满','芒种','夏至','小暑','大暑','立秋','处暑','白露','秋分','寒露','霜降','立冬','小雪','大雪','冬至'];
        const sTermInfo = [0,21208,42467,63836,85337,107014,128867,150921,173149,195551,218072,240693,263343,285989,308563,331033,353350,375494,397447,419210,440795,462224,483532,504758];
        function getSolarTerm(year, month, day) { const base = new Date(1900,0,6,2,5); for (let offset = 0; offset < 2; offset++) { const index = month * 2 + offset; const date = new Date(31556925974.7 * (year - 1900) + sTermInfo[index] * 60000 + base.getTime()); if (date.getMonth() === month && date.getDate() === day) return sTermNames[index]; } return null; }
        function updateClockAndGreeting() {
            const now = new Date(), hour = now.getHours();
            document.getElementById('clock').textContent = [hour, now.getMinutes(), now.getSeconds()].map(value => String(value).padStart(2, '0')).join(':');
            let greeting = '';
            if (currentLang === 'zh') {
                const md = `${String(now.getMonth()+1).padStart(2,'0')}${String(now.getDate()).padStart(2,'0')}`;
                const festivals = { '0101':'元旦快乐','0308':'妇女节快乐','0501':'五一劳动节','0601':'儿童节快乐','1001':'国庆节快乐','1225':'圣诞节' };
                const term = getSolarTerm(now.getFullYear(), now.getMonth(), now.getDate());
                if (festivals[md]) greeting = `🎉 今天是 ${festivals[md]}，祝你开心！`;
                else if (term) greeting = `🍃 今日节气 · 【${term}】，顺应四时，平安喜乐。`;
                else if (hour < 5) greeting = '🌙 夜深了，静谧的星空在守护你，早点休息哦';
                else if (hour < 8) greeting = '🌅 清晨的朝阳刚刚升起，新的一天充满希望';
                else if (hour < 12) greeting = '☀️ 早上好，专注当下，今天也要元气满满';
                else if (hour < 14) greeting = '🍲 中午好，记得按时吃饭，歇息一下双眼';
                else if (hour < 18) greeting = '☕ 下午好，来杯清茶或咖啡，继续保持高效';
                else if (hour < 20) greeting = '🌇 傍晚好，落日余晖很美，放下疲惫准备享受夜晚吧';
                else greeting = '✨ 晚上好，属于自己的惬意时光，好好犒劳一下自己';
            } else {
                if (hour < 5) greeting = '🌙 Late night. The stars are watching over you.';
                else if (hour < 8) greeting = '🌅 A new day is full of hope.';
                else if (hour < 12) greeting = '☀️ Good morning! Stay focused and energized.';
                else if (hour < 14) greeting = '🍲 Good noon! Remember lunch and rest your eyes.';
                else if (hour < 18) greeting = '☕ Good afternoon! Keep up the good work.';
                else if (hour < 20) greeting = '🌇 Good evening! Relax and enjoy the sunset.';
                else greeting = '✨ Good night! Enjoy your own cozy time.';
            }
            document.getElementById('greeting').textContent = greeting;
        }

        let weatherState = safeJsonParse(sessionStorage.getItem('nav_weather_cache') || '{}', {});
        async function fetchWeather() {
            if (weatherState.fetchedAt && Date.now() - weatherState.fetchedAt < 30 * 60 * 1000) return renderWeather();
            try {
                const ipData = await fetchJson('https://ipapi.co/json/', {}, 6000);
                if (!ipData.latitude || !ipData.longitude) throw new Error('No coordinates');
                const weatherData = await fetchJson(`https://api.open-meteo.com/v1/forecast?latitude=${encodeURIComponent(ipData.latitude)}&longitude=${encodeURIComponent(ipData.longitude)}&current_weather=true`, {}, 6000);
                weatherState = { city: ipData.city || 'Earth', temp: Math.round(weatherData.current_weather.temperature), code: weatherData.current_weather.weathercode, fetched: true, fetchedAt: Date.now() };
                sessionStorage.setItem('nav_weather_cache', JSON.stringify(weatherState));
            } catch { weatherState = { fetched: false }; }
            renderWeather();
        }
        function renderWeather() {
            const element = document.getElementById('weather-info');
            if (!weatherState.fetched) { element.innerHTML = `<i class="fas fa-cloud text-slate-400"></i><span>${escapeHtml(t('weatherDefault'))}</span>`; return; }
            let city = weatherState.city;
            if (currentLang === 'zh') { const map = { Singapore:'新加坡', 'Santa Clara':'圣克拉拉', 'San Jose':'圣何塞', Beijing:'北京', Shanghai:'上海', Shenzhen:'深圳', Guangzhou:'广州', Hangzhou:'杭州', Chengdu:'成都', 'Hong Kong':'香港' }; city = (map[city] || city).replace(/Province|City/gi, '').trim(); }
            const code = weatherState.code; let icon = 'fa-cloud'; let key = 'weatherCloudy';
            if (code === 0) { icon = 'fa-sun text-amber-500'; key = 'weatherClear'; }
            else if ([1,2,3].includes(code)) icon = 'fa-cloud-sun text-indigo-300';
            else if ([51,53,55,61,63,65,80,81,82].includes(code)) { icon = 'fa-cloud-showers-heavy text-sky-400'; key = 'weatherRain'; }
            else if ([71,73,75,77,85,86].includes(code)) { icon = 'fa-snowflake text-blue-200'; key = 'weatherSnow'; }
            else if ([95,96,99].includes(code)) { icon = 'fa-bolt text-yellow-500'; key = 'weatherThunder'; }
            element.innerHTML = `<i class="fas ${icon}"></i><span>${escapeHtml(city)} · ${escapeHtml(t(key))} ${Number(weatherState.temp)}°C</span>`;
        }

        // ===================== 9. 提示与全局事件 =====================
        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            const style = type === 'error' ? 'border-red-500/40 text-red-200' : type === 'success' ? 'border-emerald-500/40 text-emerald-200' : 'border-indigo-500/40 text-indigo-200';
            toast.className = `toast-enter max-w-[90vw] px-4 py-2.5 rounded-xl bg-slate-900/95 border ${style} shadow-2xl backdrop-blur text-xs text-center`;
            toast.textContent = message;
            container.appendChild(toast);
            setTimeout(() => { toast.style.opacity = '0'; toast.style.transform = 'translateY(5px)'; setTimeout(() => toast.remove(), 220); }, 2600);
        }

        document.addEventListener('click', event => {
            if (!event.target.closest('#engine-btn, #engine-menu')) document.getElementById('engine-menu').classList.add('hidden');
            if (!event.target.closest('#theme-panel, [aria-label="个性化设置"]')) document.getElementById('theme-panel').classList.add('hidden');
        });
        document.addEventListener('keydown', event => {
            if (event.key !== 'Escape') return;
            ['link-modal','section-modal','data-modal'].forEach(id => toggleModal(id, false));
            document.getElementById('theme-panel').classList.add('hidden');
            document.getElementById('engine-menu').classList.add('hidden');
        });
        window.addEventListener('beforeunload', () => { if (syncTimer) { clearTimeout(syncTimer); navigator.sendBeacon?.(CLOUD_CONFIG_URL, new Blob([JSON.stringify(siteConfig)], { type: 'application/json' })); } });

        // 初始化
        document.documentElement.lang = currentLang === 'zh' ? 'zh-CN' : 'en';
        applyLanguage();
        selectEngine(currentEngineKey);
        updateClockAndGreeting();
        setInterval(updateClockAndGreeting, 1000);
        fetchWeather();
        initCloudData();
    </script>
